[package]
name = "bevy-s2n-quic"
version = "0.19.0"
edition = "2024"
description = "An Aeronet compatible Bevy plugin providing network IO with QUIC based on s2n-quic"
readme = "README.md"
repository = "https://github.com/CorneliusCornbread/bevy-quic-networking"
documentation = "https://docs.rs/bevy-s2n-quic"
license = "MIT OR Apache-2.0"
keywords = ["gamedev", "networking", "bevy", "aeronet", "quic"]
categories = ["game-development", "network-programming"]

[dependencies]
aeronet_io = "0.21.0"
bevy = "0.19.0"
bytes = "1.12.0"
mio = { version = "1.2.4", features = ["os-poll", "net"] }
quinn-proto = { version = "0.11.19", default-features = false, features = ["rustls-ring", "bloom"] }
quinn-udp = { version = "0.6.3", default-features = false, features = ["tracing"] }
rustls = { version = "0.23.5", default-features = false, features = ["std", "ring"] }
rustls-pki-types = { version = "1.10.1", features = ["std"] }
rustls-platform-verifier = "0.7"
slab = "0.4.12"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
bevy = { version = "0.19.0", features = ["bevy_remote"] }
libc = "0.2.190"

[lints.rust]
# The stress benchmark reads extra Tokio metrics when built with
# RUSTFLAGS="--cfg tokio_unstable".
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[features]
default = ["performance-warns"]

## Creates error components/entities when connections fail
connection-errors = []

## Creates error components/entities when streams fail
stream-errors = []

## Should we warn if buffers are being filled faster than we can drain them?
performance-warns = []
