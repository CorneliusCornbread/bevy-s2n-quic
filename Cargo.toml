[package]
name = "qevy"
version = "0.20.0"
edition = "2024"
description = "An Aeronet compatible Bevy plugin providing network IO with QUIC"
readme = "README.md"
repository = "https://github.com/CorneliusCornbread/bevy-quic-networking"
documentation = ""
license = "MIT OR Apache-2.0"
keywords = ["gamedev", "networking", "bevy", "aeronet", "quic"]
categories = ["game-development", "network-programming"]

[dependencies]
aeronet_io = "0.22.0"
anyhow = "1.0.104"
bevy = "0.20.1"
bytes = "1.12.0"
futures = "0.3.32"
s2n-quic = "1.91.0"
s2n-quic-tls = "0.91.0"
thiserror = "2.0.21"
tokio = { version = "1.52.3", features = ["sync", "rt-multi-thread", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
bevy = { version = "0.20.1", features = ["bevy_remote"] }

[features]
default = ["performance-warns"]

## Creates error components/entities when connections fail
connection-errors = []

## Creates error components/entities when streams fail
stream-errors = []

## Should we warn if buffers are being filled faster than we can drain them?
performance-warns = []
